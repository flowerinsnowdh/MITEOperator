# MITEOperator settings
# 设为 true 时，死亡保留背包物品。
death.keep_inventory=true
# 设为 true 时，死亡保留经验与等级。
death.keep_experience=true
# 设为 true 时，死亡保留饥饿/食物状态。
death.keep_hunger=true
# 设为 true 时，死亡会掉落经验球。
death.drop_experience_orbs=false
# 复活等待秒数（0 表示不等待）。
death.respawn_countdown_seconds=0
# 设为 true 时，启用重连惩罚。
reconnect.penalty_enabled=false
