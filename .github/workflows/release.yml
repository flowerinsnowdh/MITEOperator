name: 'Build'

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'

    steps:
      - uses: 'actions/checkout@v6'

      - uses: 'gradle/actions/wrapper-validation@v5'

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 'Build'
        run: |
          chmod +x gradlew
          ./gradlew shadowJar

      - name: 'Release'
        uses: 'softprops/action-gh-release@v2'
        with:
          files: 'build/libs/*'
        if: github.ref_type == 'tag'
